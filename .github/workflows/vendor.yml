name: Bibliotheken ins Board holen
# Legt supabase-js und die Schrift IBM Plex Sans lokal unter site/vendor ab,
# damit das Board ohne Internet (Selbstbetrieb) funktioniert.
# Wird nur von Hand gestartet (Actions -> Bibliotheken ins Board holen -> Run workflow).
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pakete aus npm laden (npm prueft die Pruefsummen)
        run: |
          mkdir -p /tmp/v && cd /tmp/v
          npm pack @supabase/supabase-js@2.45.4 @fontsource/ibm-plex-sans@5 pdfjs-dist@3.11.174
          for f in *.tgz; do mkdir -p "${f%.tgz}" && tar xzf "$f" -C "${f%.tgz}"; done
          ls
      - name: Dateien ablegen
        run: |
          mkdir -p site/vendor/fonts
          cp /tmp/v/supabase-supabase-js-2.45.4/package/dist/umd/supabase.js site/vendor/supabase-2.45.4.js
          for w in 400 500 600 700; do for s in latin latin-ext; do
            cp /tmp/v/fontsource-ibm-plex-sans-*/package/files/ibm-plex-sans-$s-$w-normal.woff2 site/vendor/fonts/
          done; done
          cp /tmp/v/fontsource-ibm-plex-sans-*/package/LICENSE site/vendor/fonts/LICENSE-IBM-Plex.txt || true
          mkdir -p site/vendor/pdfjs-3.11.174
          cp /tmp/v/pdfjs-dist-3.11.174/package/legacy/build/pdf.min.js /tmp/v/pdfjs-dist-3.11.174/package/legacy/build/pdf.worker.min.js site/vendor/pdfjs-3.11.174/
          cp /tmp/v/pdfjs-dist-3.11.174/package/LICENSE site/vendor/pdfjs-3.11.174/LICENSE.txt || true
          ls -la site/vendor site/vendor/fonts
      - name: Einchecken
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/vendor
          git diff --cached --quiet || git commit -m "Bibliotheken (supabase-js, pdf.js) und Schrift lokal ablegen"
          git push
