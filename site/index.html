$("pwdlg").addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;if("pwx"in b.dataset){$("pwdlg").close();return}if(!("pwsave"in b.dataset))return;const v=$("pw1").value;if(v.length<8){$("pwmsg").textContent="Das Passwort braucht mindestens 8 Zeichen.";return}
const{error}=await SB.auth.updateUser({password:v});if(error){$("pwmsg").textContent="Das Passwort konnte nicht gespeichert werden. Bitte noch einmal versuchen.";return}$("pwdlg").close();toast("Passwort gespeichert.");try{history.replaceState(null,"",location.pathname)}catch(_){}});
$("lform").addEventListener("submit",async e=>{e.preventDefault();$("lmsg").textContent="Anmelden …";const{data,error}=await SB.auth.signInWithPassword({email:$("lem").value.trim(),password:$("lpw").value});
if(error){$("lmsg").textContent="Anmeldung fehlgeschlagen. Bitte E-Mail und Passwort prüfen.";return}$("lmsg").textContent="";start(data.user)});
$("lforgot").onclick=async()=>{const em=$("lem").value.trim();if(!em){$("lmsg").textContent="Bitte zuerst die E-Mail-Adresse eintragen.";return}
const{error}=await SB.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});$("lmsg").textContent=error?"Die E-Mail konnte nicht gesendet werden. Bitte später noch einmal versuchen.":"Wir haben dir eine E-Mail mit einem Link zum Festlegen des Passworts geschickt."};
$("lout").onclick=()=>SB.auth.signOut().then(()=>location.reload());
/* ---- Meine ToDos (nur für die angemeldete Person) ---- */
const APPV="1.6";let mySaved=null,myBusy=false,myT=0,MYERR=false,myCh=null;
const myOpenN=()=>MY.filter(x=>!x.d).length;
function myBtn(){const b=$("myb");b.hidden=!MYON;const n=myOpenN();b.textContent="Meine ToDos"+(n?" · "+n:"")}
function myCard(){if(!MYON)return "";const n=MY.filter(x=>!x.d).length,L=MY.map((x,i)=>({x,i})).filter(a=>!a.x.d);
return `<div class="card sup mine" data-my="1" title="Klicken: deine persönliche Liste"><h4>Meine ToDos <span class="tag">${n?n+" offen":"nichts offen"}</span></h4><div style="margin-bottom:4px"><span class="tag">Nur für dich sichtbar</span></div>${L.slice(0,6).map(a=>`<div class="it"><input type="checkbox" data-myd="${a.i}"><span>${esc(a.x.t)}</span></div>`).join("")}${L.length>6?`<small class="mu">+ ${L.length-6} weitere</small>`:""}</div>`}
function openMy(){const d=$("mydlg"),L=MY.map((x,i)=>({x,i})),srt=L.filter(a=>!a.x.d).concat(L.filter(a=>a.x.d));
d.innerHTML=`<div style="display:flex;justify-content:space-between;gap:8px"><b>Meine ToDos</b><button data-myx aria-label="Schließen">✕</button></div><p class="mu" style="margin:2px 0 8px">Nur für dich sichtbar (${esc(KZ)}). Die anderen im Team sehen diese Liste nicht.</p><div style="display:flex;gap:6px;margin:6px 0"><input class="f" id="mynew" placeholder="z. B. Angebot Becker nachfassen" autocomplete="off"><button class="p" data-myadd>+ Hinzufügen</button></div>${srt.map(a=>`<div class="myrow${a.x.d?" done":""}"><input type="checkbox" data-myd="${a.i}" ${a.x.d?"checked":""} aria-label="Erledigt"><span>${esc(a.x.t)}</span><button data-mydel="${a.i}" title="Löschen" aria-label="Löschen">✕</button></div>`).join("")||"<p class='mu'>Noch nichts auf deiner Liste.</p>"}${L.some(a=>a.x.d)?`<p><button data-myclr>Erledigte entfernen</button></p>`:""}`;if(!d.open)d.showModal()}
function myChanged(){myBtn();draw();if($("mydlg").open)openMy();clearTimeout(myT);myT=setTimeout(myPut,400)}
async function myPut(){if(!SB||!USER||MYERR)return;const s=canon({items:MY});if(s===mySaved)return;if(myBusy){clearTimeout(myT);myT=setTimeout(myPut,300);return}myBusy=true;pend++;status();
try{const{error}=await SB.from("board_privat").upsert({user_id:USER.id,data:{items:MY},updated_at:new Date().toISOString()});if(error){errUntil=Date.now()+5000;myT=setTimeout(myPut,5200)}else mySaved=s}
catch(_){errUntil=Date.now()+5000;myT=setTimeout(myPut,5200)}finally{myBusy=false;pend--;status()}}
async function myLoad(){if(!SB||!USER||MYERR)return;const{data,error}=await SB.from("board_privat").select("data").eq("user_id",USER.id).maybeSingle();
if(error){if(/PGRST205|42P01/.test(error.code||"")||/does not exist|schema cache/i.test(error.message||"")){MYERR=true;MYON=false;myBtn();if(ADM)toast("„Meine ToDos“ ist noch nicht eingerichtet: bitte update-1.1-meine-todos.sql in Supabase ausführen.")}else setTimeout(myLoad,6000);return}
if(MYON&&canon({items:MY})!==mySaved)return;MY=(data&&data.data&&data.data.items)||[];mySaved=canon({items:MY});MYON=true;myBtn();draw();if($("mydlg").open)openMy();
if(!myCh)myCh=SB.channel("privat-"+USER.id).on("postgres_changes",{event:"*",schema:"public",table:"board_privat",filter:"user_id=eq."+USER.id},pl=>{const v=pl.new&&pl.new.data;if(v&&canon({items:MY})===mySaved){MY=v.items||[];mySaved=canon({items:MY});myBtn();draw();if($("mydlg").open)openMy()}}).subscribe()}
$("myb").onclick=openMy;
document.addEventListener("click",e=>{const c=e.target.closest("[data-my]");if(c&&!e.target.closest("input"))openMy()});
document.addEventListener("change",e=>{const i=e.target.dataset&&e.target.dataset.myd;if(i===undefined||!MY[+i])return;MY[+i].d=e.target.checked?1:0;myChanged()});
function myAdd(){const i=$("mynew"),v=i.value.trim();if(!v){i.focus();return}MY.unshift({t:v,d:0});myChanged();setTimeout(()=>{const n=$("mynew");if(n)n.focus()},30)}
$("mydlg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if("myx"in b.dataset)$("mydlg").close();else if("myadd"in b.dataset)myAdd();else if(b.dataset.mydel!==undefined){MY.splice(+b.dataset.mydel,1);myChanged()}else if("myclr"in b.dataset){MY=MY.filter(x=>!x.d);myChanged()}});
$("mydlg").addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.id=="mynew"){e.preventDefault();myAdd()}});
$("mydlg").addEventListener("close",draw);
async function start(user){if(started||!user)return;USER=user;
const{data:t,error}=await SB.from("board_team").select("kz,voll").eq("email",(user.email||"").toLowerCase()).maybeSingle();
if(error||!t){showLogin("Dein Zugang ("+(user.email||"")+") ist noch keinem Kürzel zugeordnet. Bitte SD oder OF Bescheid geben.");$("lform").hidden=true;$("lout").hidden=false;return}
started=true;KZ=t.kz;ADM=!!t.voll;$("login").hidden=true;DB=true;applyRights();status();await loadAll();subscribe();myLoad()}
async function boot(){if(!window.supabase||!CFG.url||!CFG.key||/DEIN|XXXX/.test(CFG.url+CFG.key)){showLogin(window.supabase?"Die Verbindung ist noch nicht eingerichtet. Bitte in config.js die Supabase-Adresse und den anon-Schlüssel eintragen.":"Die Supabase-Bibliothek konnte nicht geladen werden. Bitte Internetverbindung prüfen und neu laden.");$("lform").hidden=true;return}
const fl=/type=(invite|recovery|signup|magiclink)/.test(location.hash);
SB=supabase.createClient(CFG.url,CFG.key);
SB.auth.onAuthStateChange(ev=>{if(ev=="PASSWORD_RECOVERY")setTimeout(askPw,300)});
const{data:{session}}=await SB.auth.getSession();if(!session){showLogin();return}
await start(session.user);if(fl&&started)askPw()}
/* ---- Speichern & Live-Abgleich (Supabase) ---- */
const T={projekte:"board_projekte",mitarbeiter:"board_mitarbeiter",bestellung:"board_bestellung"};
let DB=null,loaded=false,ro=false,errUntil=0,pend=0,schT=0,subN=0;const saved={"bestellung/extra":'{"items":[]}'},busy={},gone=new Set();
const canon=o=>JSON.stringify(o,(k,v)=>v&&typeof v=="object"&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);
function status(){const s=$("sync");if(!s)return;let m="",w=false;
if(!DB)m="";else if(!loaded)m="Lädt …";else if(ro){m="Nur ansehen – keine Schreibrechte";w=true}
else if(errUntil>Date.now()){m="Nicht gespeichert – keine Verbindung, neuer Versuch gleich";w=true}
else if(pend||schT)m="Speichert …";else m="Alle Änderungen gespeichert";
if(KZ&&m)m=KZ+" · "+m;s.textContent=m;s.className=w?"warn":""}
function sched(){if(!DB||!loaded||ro)return;clearTimeout(schT);schT=setTimeout(()=>{schT=0;flush()},500);status()}
async function deny(k){const[coll,id]=k.split("/");toast("Diese Änderung dürfen nur SD und OF vornehmen. Sie wurde zurückgesetzt.");const arr=coll=="projekte"?P:EMP;
const{data}=await SB.from(T[coll]).select("id,data").eq("id",id).maybeSingle();if(data)applyRow(coll,arr,id,data.data,true);else dropRow(coll,arr,id,true);after()}
async function put(k,s){if(busy[k])return;busy[k]=1;pend++;status();const[coll,id]=k.split("/"),tb=SB.from(T[coll]);
try{let res;if(s===null)res=await tb.delete().eq("id",id);else{const body=JSON.parse(s);
res=coll!="projekte"?await tb.upsert({id,data:body}).select("id"):saved[k]===undefined?await tb.insert({id,data:body}).select("id"):await tb.update({data:body,updated_at:new Date().toISOString()}).eq("id",id).select("id")}
if(res.error){const c=res.error.code||"",msg=res.error.message||"";if(c=="23505"){saved[k]="?"}else if(c=="42501"||c=="P0001"||/row-level security|SD und OF/i.test(msg))await deny(k);else errUntil=Date.now()+5000}
else if(s!==null&&(!res.data||!res.data.length))await deny(k);else{if(s===null)delete saved[k];else saved[k]=s}}
catch(_){errUntil=Date.now()+5000}
finally{busy[k]=0;pend--;status();setTimeout(flush,errUntil>Date.now()?5200:50)}}
function flush(){if(!DB||!loaded||ro||errUntil>Date.now())return status();
P.forEach(p=>{const k="projekte/"+p.id,s=canon(p);if(s!==saved[k])put(k,s)});
EMP.forEach(e=>{const k="mitarbeiter/"+e.id,s=canon(e);if(s!==saved[k])put(k,s)});
Object.keys(saved).forEach(k=>{if(k.startsWith("mitarbeiter/")&&!EMP.some(e=>"mitarbeiter/"+e.id==k)){gone.add(k);put(k,null)}});
const s=canon({items:EXTRA});if(s!==saved["bestellung/extra"])put("bestellung/extra",s);status()}
function applyRow(coll,arr,id,data,force){const k=coll+"/"+id;if(gone.has(k)||!data)return;const s=canon(data),i=arr.findIndex(x=>String(x.id)===String(id)),loc=i>=0?canon(arr[i]):null;
if(!force&&loc!==null&&loc!==saved[k])return;const o=JSON.parse(s);if(i>=0)arr[i]=o;else arr.push(o);saved[k]=s}
function dropRow(coll,arr,id,force){const k=coll+"/"+id,i=arr.findIndex(x=>String(x.id)===String(id));if(i>=0&&(force||canon(arr[i])===saved[k]))arr.splice(i,1);delete saved[k]}
function applyFull(coll,arr,rows){const seen=new Set(rows.map(r=>coll+"/"+r.id));rows.forEach(r=>applyRow(coll,arr,r.id,r.data));
for(let i=arr.length-1;i>=0;i--){const k=coll+"/"+arr[i].id;if(!seen.has(k)&&saved[k]!==undefined&&canon(arr[i])===saved[k]){arr.splice(i,1);delete saved[k]}}}
function applyExtra(data){const k="bestellung/extra",s=canon({items:(data&&data.items)||[]});if(!loaded||canon({items:EXTRA})===saved[k]){EXTRA=JSON.parse(s).items;saved[k]=s}}
function after(){draw();status();ensureUrls();const d=$("dlg");if(d.open&&d.dataset.tab=="d")open(d.dataset.id,"d")}
async function loadAll(){const r=await Promise.all(Object.values(T).map(t=>SB.from(t).select("id,data")));
if(r.some(x=>x.error)){errUntil=Date.now()+5000;status();setTimeout(loadAll,6000);return}
applyFull("projekte",P,r[0].data);applyFull("mitarbeiter",EMP,r[1].data);const ex=r[2].data.find(x=>x.id=="extra");applyExtra(ex?ex.data:null);loaded=true;after()}
function rt(coll,arr,pl){if(pl.eventType=="DELETE"){if(pl.old&&pl.old.id!=null)dropRow(coll,arr,pl.old.id)}else if(pl.new)applyRow(coll,arr,pl.new.id,pl.new.data);after()}
function subscribe(){SB.channel("board")
.on("postgres_changes",{event:"*",schema:"public",table:T.projekte},pl=>rt("projekte",P,pl))
.on("postgres_changes",{event:"*",schema:"public",table:T.mitarbeiter},pl=>rt("mitarbeiter",EMP,pl))
.on("postgres_changes",{event:"*",schema:"public",table:T.bestellung},pl=>{if(pl.new&&pl.new.id=="extra"){applyExtra(pl.new.data);after()}})
.subscribe(st=>{if(st=="SUBSCRIBED"&&subN++)loadAll()});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&loaded){loadAll();myLoad()}})}
for(const n of ["draw","open","openE","renderSup","openSteps","showInv"]){const f=window[n];window[n]=function(...a){const r=f.apply(this,a);sched();return r}}
document.addEventListener("change",()=>sched());document.addEventListener("input",()=>sched());
status();boot();
</script></body></html>
